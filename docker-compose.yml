# MongoDB e MinIO para desenvolvimento:  docker compose up -d mongo minio
# O app junto (perfil "app"):            docker compose --profile app up --build
services:
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-dados:/data/db

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: markdocs
      MINIO_ROOT_PASSWORD: markdocs-segredo
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console
    volumes:
      - minio-dados:/data

  app:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      DOCUMENTOS_CONNECTION_STRING: mongodb://mongo:27017
      DOCUMENTOS_DATABASE_NAME: markdocs
      ARMAZENAMENTO_PROVEDOR: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: markdocs
      MINIO_SECRET_KEY: markdocs-segredo
      MINIO_BUCKET: markdocs
    depends_on:
      - mongo
      - minio

volumes:
  mongo-dados:
  minio-dados:
